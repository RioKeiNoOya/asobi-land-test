</style><header><a href="./index.html">← あそびランド</a><h1>🐠 かたはめパズル</h1><button onclick="start()">↻ もういっかい</button></header><div class="tools"><button onclick="showSetup()">⚙️ えらびなおす</button><button onclick="hint()">💡 ヒント</button></div><div id="setup" class="setup"><h2>🐠 かたはめパズル</h2><div class="label">① ばしょを えらぼう</div><div class="option-row"><button data-sc="sea" class="chosen" onclick="setScene('sea')"><span>🌊</span>うみ</button><button data-sc="market" onclick="setScene('market')"><span>🛒</span>スーパー</button></div><div class="label">② むずかしさを えらぼう</div><div class="option-row"><button data-lv="3" class="chosen" onclick="setLevel(3)"><span>🌼</span>かんたん<br>3こ</button><button data-lv="4" onclick="setLevel(4)"><span>⭐</span>ふつう<br>4こ</button><button data-lv="6" onclick="setLevel(6)"><span>🔥</span>むずかしい<br>6こ</button></div><button class="go" onclick="start();document.getElementById('setup').classList.add('hidden')">この せっていで あそぶ ▶</button></div><div id="board" class="board"><div class="shelf"></div></div><div id="tray" class="tray"></div><p id="message" class="note">おなじ かたちに はめてね！</p><details class="parent"><summary>🔒 おうちのひと：カスタム画像の登録・削除</summary><p class="note">背景が透明なPNGがおすすめ。名前を入れると読み上げます。画像は端末内に保存します。</p><input type="file" id="files" accept="image/*" multiple><input id="customName" placeholder="名前（例：アンパンマン）"><select id="category"><option value="sea0">海：水中</option><option value="sea1">海：海底</option><option value="sea2">海：砂浜</option><option value="market0">スーパー：野菜</option><option value="market1">スーパー：果物</option><option value="market2">スーパー：お客さん</option></select><button onclick="addCustom()">＋ とうろく</button><div id="manage"></div></details><script>
const sea=[[['クジラ','🐋'],['イルカ','🐬'],['マグロ','🐟'],['タイ','🐠'],['クラゲ','🪼'],['クマノミ','🐠']],[['タコ','🐙'],['ヒトデ','⭐'],['海藻','🌿'],['ナマコ','🪱']],[['カニ','🦀'],['カメ','🐢'],['ヤドカリ','🐚']]];const market=[[['にんじん','🥕'],['だいこん','🥬'],['ほうれんそう','🥬'],['たまねぎ','🧅'],['じゃがいも','🥔'],['さつまいも','🍠']],[['りんご','🍎'],['みかん','🍊'],['ぶどう','🍇'],['いちご','🍓'],['もも','🍑'],['すいか','🍉'],['パイナップル','🍍'],['バナナ','🍌'],['さくらんぼ','🍒']],[['カートのおきゃくさん','🛒'],['かごのおきゃくさん','🧍'],['えらぶおきゃくさん','🧑'],['レジのおきゃくさん','👩']]];let custom=[];try{custom=JSON.parse(localStorage.getItem('asobi_shape_custom')||'[]')}catch{};let active=[],done=new Set(),positions=[],selectedScene='sea',selectedLevel=3;function showSetup(){document.getElementById('setup').classList.remove('hidden')}function setScene(s){selectedScene=s;document.querySelectorAll('[data-sc]').forEach(b=>b.classList.toggle('chosen',b.dataset.sc===s))}function setLevel(n){selectedLevel=n;document.querySelectorAll('[data-lv]').forEach(b=>b.classList.toggle('chosen',+b.dataset.lv===n))}const $=id=>document.getElementById(id);function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.9;speechSynthesis.speak(u)}catch{}}function beep(f=520){try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.setValueAtTime(.04,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.15);o.start();o.stop(c.currentTime+.16)}catch{}}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}const rasterItems={"クジラ":"piece-0","マグロ":"fish-small","タイ":"fish-blue","海藻":"piece-3","ナマコ":"piece-4","ヤドカリ":"piece-5","だいこん":"ai-daikon","ほうれんそう":"ai-spinach","たまねぎ":"piece-8","じゃがいも":"piece-9","さつまいも":"piece-10","みかん":"ai-orange","ぶどう":"ai-grapes","もも":"piece-13","すいか":"piece-14","カートのおきゃくさん":"piece-15","かごのおきゃくさん":"piece-16","えらぶおきゃくさん":"piece-17","レジのおきゃくさん":"piece-18","イルカ":"dolphin","クラゲ":"jelly","クマノミ":"ai-clown","タコ":"octopus","ヒトデ":"ai-starfish","カニ":"crab","カメ":"ai-turtle","にんじん":"ai-carrot","りんご":"ai-apple","いちご":"ai-strawberry","パイナップル":"pineapple","バナナ":"ai-banana","さくらんぼ":"deco-cherry"};function itemNode(item){let path=item.src||(rasterItems[item.name]?rasterItems[item.name]+'.png':'');return path?`<img src="${path}" style="width:80%;height:80%;object-fit:contain;pointer-events:none">`:item.emoji}function start(){try{speechSynthesis.cancel()}catch{};let sc=selectedScene,level=selectedLevel;let base=sc==='sea'?sea:market;let pool=base.map((group,i)=>shuffle(group.map(([name,emoji])=>({name,emoji,cat:i})).concat(custom.filter(x=>x.scene===sc&&x.cat===i))));let picks=[];for(let i=0;i<3;i++)if(pool[i].length)picks.push(pool[i].shift());if(level===4){let candidates=shuffle(pool.flat());if(candidates.length)picks.push(candidates[0])}if(level===6){for(let i=0;i<3;i++)if(pool[i].length)picks.push(pool[i].shift())}active=shuffle(picks);done=new Set();$('board').className='board '+(sc==='market'?'market':'');$('board').innerHTML='<div class="shelf"></div>';$('tray').innerHTML='';positions=[];active.forEach((item,i)=>{let zone=item.cat;let x=sc==='sea'?[15,22,82][zone]:[13,43,72][zone],y=sc==='sea'?[32,72,3][zone]:[34,34,69][zone];let count=positions.filter(p=>p.cat===zone).length;x+=count?(zone===2?-5:15):0;y+=count?(zone===2?1:-12):0;positions.push({cat:zone,x,y});let h=document.createElement('div');h.className='hole'+(level===3?' simple':'');h.style.left=x+'%';h.style.top=y+'%';h.dataset.idx=i;h.dataset.shape=['circle','star','triangle','heart'][i%4];h.innerHTML='';h.dataset.shape=['circle','star','triangle','heart'][i%4];if(level!==3){let path=item.src||(rasterItems[item.name]?rasterItems[item.name]+'.png':'');if(path){h.style.webkitMaskImage=`url("${path}")`;h.style.maskImage=`url("${path}")`;h.style.webkitMaskSize=h.style.maskSize='contain';h.style.webkitMaskRepeat=h.style.maskRepeat='no-repeat';h.style.webkitMaskPosition=h.style.maskPosition='center';h.style.background='#b6dce9';h.style.border='0';h.style.filter='drop-shadow(0 2px 2px #174c70)'} }$('board').append(h);let b=document.createElement('button');b.className='piece'+(level===3?' simple':' natural');b.dataset.shape=['circle','star','triangle','heart'][i%4];b.innerHTML=itemNode(item);b.setAttribute('aria-label',item.name);b.onpointerdown=e=>dragStart(e,b,i);$('tray').append(b)});$('message').textContent='おなじ かたちに はめてね！'}function dragStart(e,b,i){if(done.has(i))return;e.preventDefault();beep(390);speak(active[i].name);b.setPointerCapture(e.pointerId);let g=document.createElement('div');g.className='ghost'+(selectedLevel===3?' piece simple':' piece natural');g.dataset.shape=['circle','star','triangle','heart'][i%4];g.innerHTML=itemNode(active[i]);document.body.append(g);g.querySelector('img')?.setAttribute('style','width:65px;height:65px;object-fit:contain');const move=ev=>{g.style.left=ev.clientX-28+'px';g.style.top=ev.clientY-35+'px'};move(e);b.classList.add('dragging');b.onpointermove=move;b.onpointerup=ev=>{g.remove();b.classList.remove('dragging');b.onpointermove=null;b.onpointerup=null;let hole=$('board').querySelector(`.hole[data-idx="${i}"]`),r=hole.getBoundingClientRect();let cx=r.left+r.width/2,cy=r.top+r.height/2;if(Math.hypot(ev.clientX-cx,ev.clientY-cy)<Math.max(70,r.width*.85)){done.add(i);hole.classList.add('done');hole.style.webkitMaskImage='none';hole.style.maskImage='none';hole.style.background='transparent';hole.style.border='0';hole.innerHTML=itemNode(active[i]);b.style.visibility='hidden';beep(740);setTimeout(()=>speak(active[i].name),190);if(done.size===active.length){$('message').textContent='🎉 ぜんぶ できた！ 🎉';setTimeout(()=>beep(950),300)}}};b.onpointercancel=()=>{g.remove();b.classList.remove('dragging');b.onpointermove=null;b.onpointerup=null}}function hint(){let h=$('board').querySelector('.hole:not(.done)');if(h){h.classList.add('hint');setTimeout(()=>h.classList.remove('hint'),1300)}}function addCustom(){let fs=Array.from($('files').files),name=$('customName').value.trim(),c=$('category').value;if(!fs.length||!name){alert('画像と名前を入れてね');return}let scene=c.startsWith('sea')?'sea':'market',cat=+c.slice(-1);let jobs=fs.map(f=>new Promise(res=>{let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let can=document.createElement('canvas');let k=Math.min(1,300/Math.max(im.width,im.height));can.width=Math.round(im.width*k);can.height=Math.round(im.height*k);can.getContext('2d').drawImage(im,0,0,can.width,can.height);custom.push({name:fs.length>1?`${name} ${f.name.replace(/\.[^.]+$/, '')}`:name,src:can.toDataURL('image/png'),scene,cat});res()};im.src=reader.result};reader.readAsDataURL(f)}));Promise.all(jobs).then(()=>{try{localStorage.setItem('asobi_shape_custom',JSON.stringify(custom))}catch{alert('保存容量が足りない可能性があります')}manage();start()})}function manage(){$('manage').innerHTML='';custom.forEach((c,i)=>{let b=document.createElement('button');b.textContent=c.name+' ×';b.onclick=()=>{if(confirm(c.name+'を削除する？')){custom.splice(i,1);localStorage.setItem('asobi_shape_custom',JSON.stringify(custom));manage();start()}};$('manage').append(b)})}manage();start();
