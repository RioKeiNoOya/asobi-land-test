n:none;cursor:grab;font-size:32px;user-select:none;filter:drop-shadow(0 2px 1px #8a6a5a)}.decor img{width:52px;height:52px;object-fit:contain}.small{font-size:12px} @media(max-width:550px){.layout{grid-template-columns:42% 58%}.menu{padding:7px}.choices{grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}.choice{min-height:59px;font-size:12px}.emoji{font-size:24px}.steps button{padding:7px;font-size:12px}.heading{font-size:16px}.decor{font-size:25px}}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-x pan-y}button{touch-action:manipulation}.preview,.decor,#decorLayer{touch-action:none}.menu{display:flex;flex-direction:column}.menu .heading{margin:4px 0 7px}.choices{flex:0 1 auto;overflow:hidden}.steps{flex-shrink:0}.actions{flex-shrink:0}.page-nav{display:flex;justify-content:center;align-items:center;gap:12px;margin:5px 0;flex-shrink:0}.page-nav button{padding:6px 15px;border-radius:15px;background:#ffe0a8}.page-nav button:disabled{opacity:.3}#customArea{flex-shrink:0;margin-top:4px!important;padding:5px!important}.tiny{margin:4px 0}.trash-zone{position:absolute;right:8px;bottom:32px;z-index:8;background:#fff7ed;border:3px dashed #d48b8b;border-radius:18px;padding:8px 12px;font-size:15px;font-weight:900;color:#9e5252;pointer-events:none;box-shadow:0 3px 12px #0002}.trash-zone.hot{background:#ffc4c4;border-color:#e44b58;transform:scale(1.07)}#decorLayer .decor{z-index:3}.choice img{max-width:42px;max-height:42px}.choice .emoji{filter:drop-shadow(0 1px 1px #fff8)}#customArea input{font-size:13px}#customManage{display:flex;gap:4px;flex-wrap:wrap;max-height:42px;overflow:hidden}#customManage button{background:#ffe1d2;padding:3px 7px;border-radius:9px;font-size:11px}@media(max-height:650px){.choice{min-height:46px}.choice .emoji{font-size:21px}.actions button{padding:7px!important}.menu .heading{font-size:15px;margin:3px}.steps button{padding:6px!important}#note{display:none}}

<header><a href="./index.html" style="color:#633d2a;text-decoration:none;font-weight:bold">← あそびランド</a><h1>🍦 ちいさなソフトクリームやさん</h1><button class="secondary" onclick="reset()">はじめから</button></header>
<main class="layout"><section class="preview" id="preview"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 430" aria-label="ソフトクリームのプレビュー">
<ellipse cx="125" cy="401" rx="79" ry="13" fill="#d9c6aa"/><rect x="93" y="369" width="64" height="17" rx="7" fill="#aab9c1"/><rect x="119" y="334" width="12" height="40" fill="#aab9c1"/><ellipse cx="125" cy="332" rx="53" ry="12" fill="#8fa3af"/>
<g id="cone"></g><g id="ice"></g><g id="sauce"></g><g id="sprinkle"></g></svg><div id="decorLayer" style="position:absolute;inset:0;pointer-events:none"></div><div id="trashZone" class="trash-zone">🗑️ ここに すてる</div><div class="toast" id="toast">すきなものを えらんでね！</div></section>
<section class="menu"><nav class="steps" id="steps"></nav><h2 class="heading" id="heading"></h2><div id="mixControls" style="display:none;justify-content:center;gap:10px;margin:5px"><button id="mixOne" onclick="state.mix=false;state.flavor2=null;render()">1しょく</button><button id="mixTwo" onclick="state.mix=true;state.flavor2=null;render()">ミックス（2しょく）</button></div><div class="choices" id="choices"></div><div class="page-nav" id="pageNav"><button onclick="pageChange(-1)">◀ まえ</button><b id="pageCount">1 / 1</b><button onclick="pageChange(1)">つぎ ▶</button></div><div id="customArea"><label>かざりの イラストを とうろく <input type="file" accept="image/*" id="upload" multiple></label><div id="customManage"></div><div class="tiny">とうろくした画像はこの端末のブラウザに保存します。</div></div><div class="actions"><button class="secondary" onclick="back()">◀ まえ</button><button class="primary" onclick="next()">つぎへ ▶</button><button class="secondary" onclick="save()">📷 ほぞん</button></div><p class="tiny" id="note"></p></section></main>
<script>
const steps=['コーン','まきかた','あじ','ソース','かざり'];let step=0, page=0, savedSignature='',decors=[],serial=0;
const cones=[['ワッフル','🧇','#d4a36d'],['チョコワッフル','🍫','#78432c'],['カラフル','🌈','#efaf67'],['フラワー','🌼','#e3b77c'],['ハート','❤️','#d5a067'],['ワッフルカップ','🧇','#d7a46b']];
const shapes=[['まるまる','☁️'],['ぐるぐる','🍦'],['ほそほそ','🧵']];
const flavors=[['バニラ','🌼','#fff0d2'],['いちご','🍓','#f5a0bc'],['ラズベリー','🍓','#e93649'],['まっちゃ','🍃','#91ba72'],['チョコ','🍫','#8d5c40'],['ラムネ','🫧','#85d8f2'],['みかん','🍊','#f7a13d'],['ラベンダー','🪻','#bba3dd'],['レモン','🍋','#f4e34f']];
const sauces=[['なし','🚫'],['チョコ','🍫'],['いちご','🍓'],['ホワイト','🥛'],['カラースプレー','🌈']];
const decorations=[['いちご','🍓'],['さくらんぼ','🍒'],['バナナ','🍌'],['クッキー','🍪'],['ウェハース','🧇'],['チョコスティック','🍫'],['ほし','⭐'],['ハート','❤️'],['リボン','🎀'],['おたんじょうび','🎉']];
let state={cone:0,shape:1,flavor:0,flavor2:null,mix:false,sauce:0,sprinkles:false};
let customs=[];try{customs=JSON.parse(localStorage.getItem('soft_customs')||'[]')}catch{}
function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.85;speechSynthesis.speak(u)}catch{}}
function beep(freq=500){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=freq;g.gain.setValueAtTime(.045,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.13);o.start();o.stop(a.currentTime+.14)}catch{}}
function pageChange(d){page=Math.max(0,Math.min(page+d,Math.ceil(currentOptions().length/10)-1));render()}function currentOptions(){return [cones,shapes,flavors,sauces,decorations.concat(customs.map(c=>[c.name,'🖼️',c.data]))][step]}function choose(i){beep();if(step===0){state.cone=i;speak(cones[i][0]+'コーン')}if(step===1){state.shape=i;speak(shapes[i][0])}if(step===2){if(state.mix){if(state.flavor2===null){state.flavor=i;state.flavor2=-1}else if(state.flavor2===-1){state.flavor2=i}else{state.flavor=i;state.flavor2=-1}}else{state.flavor=i} speak(flavors[i][0])}if(step===3){if(i===4){state.sprinkles=!state.sprinkles}else{state.sauce=i} speak(sauces[i][0])}if(step===4){let items=currentOptions();if(decors.length>=10){document.getElementById('toast').textContent='かざりは 10こまで！';return}let item=items[i];decors.push({id:++serial,label:item[0],emoji:item[1],src:item[2]||({0:'ai-strawberry.png',1:'deco-cherry.png',2:'ai-banana.png',4:'deco-wafer.png',6:'deco-star.png',7:'deco-heart.png',8:'deco-bow.png',}[i]||''),x:50+(decors.length%3-1)*13,y:27+Math.floor(decors.length/3)*9});speak(item[0]);}render()}

function coneSvg(i=state.cone){
 if(i===5)return '<image href="cone-waffle-cup-raster.png" x="55" y="190" width="140" height="157" preserveAspectRatio="none"/>';
 return '<image href="cone-raster-'+Math.min(i,4)+'.png" x="60" y="207" width="130" height="180" preserveAspectRatio="none"/>';
}
function tint(hex,factor){
 let a=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));
 return '#'+a.map(v=>Math.max(0,Math.min(255,Math.round(factor>0?v+(255-v)*factor:v*(1+factor)))).toString(16).padStart(2,'0')).join('');
}

// Keep the original generated vanilla artwork unchanged. Other flavours retain the
// original photographed highlights and shadows instead of multiplying RGB by a tint.
function flavorFilter(n){
 // Vanilla keeps the untouched original art. For other flavours, tint the
 // original luminance with a continuous tonal curve, not a flat two-tone wash.
 if(n===0)return '';
 const rgb=[1,3,5].map(i=>parseInt(flavors[n][2].slice(i,i+2),16)/255);
 // Seven smoothly interpolated levels retain subtle highlights, midtones and
 // shadows. The initial pale end also prevents dark, muddy vanilla-like beige.
 const levels=[.43,.55,.68,.79,.89,.97,1.04];
 const tables=rgb.map(v=>levels.map((level,j)=>{
   const lift=[0,.012,.025,.045,.075,.11,.16][j];
   return Math.min(1,Math.max(0,v*level+lift)).toFixed(4);
 }).join(' '));
 return '<filter id="flavorTint'+n+'" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB">'+
   '<feColorMatrix type="saturate" values="0" result="gray"/>'+
   '<feGaussianBlur in="gray" stdDeviation="0.20" result="softGray"/>'+
   '<feComponentTransfer in="softGray">'+
   '<feFuncR type="table" tableValues="'+tables[0]+'"/>'+
   '<feFuncG type="table" tableValues="'+tables[1]+'"/>'+
   '<feFuncB type="table" tableValues="'+tables[2]+'"/>'+
   '</feComponentTransfer></filter>';
}
const iceFiles=['soft-round.png','soft-classic.png','soft-fine.png'];
function icePicture(n,shape=state.shape){
 const filter=n===0?'':' filter="url(#flavorTint'+n+')"';
 return '<image href="'+iceFiles[shape]+'?art=original-1" x="62" y="42" width="126" height="192" preserveAspectRatio="xMidYMid meet"'+filter+'/>';
}
function oneScoop(n,shape=state.shape){
 return '<defs>'+flavorFilter(n)+'</defs>'+icePicture(n,shape);
}
// A winding edge follows the folds of the soft serve rather than a straight
// vertical split. Both halves use the *same* artwork, so their ridges align.
const mixSeam='M 127 37 C 121 47 116 51 129 59 L 138 65 Q 141 71 129 79 L 113 91 Q 109 97 127 105 L 142 113 Q 148 120 132 128 L 112 140 Q 106 145 126 155 L 145 162 Q 150 168 131 180 L 110 193 Q 107 198 127 208 L 141 216 Q 146 225 126 240';
function iceSvg(){
 if(state.mix&&state.flavor2!==null&&state.flavor2>=0){
  return '<defs><clipPath id="scoopLeft"><path d="'+mixSeam+' L 50 240 L 50 30 Z"/></clipPath>'+
   '<clipPath id="scoopRight"><path d="'+mixSeam+' L 198 240 L 198 30 Z"/></clipPath></defs>'+
   '<g clip-path="url(#scoopLeft)">'+oneScoop(state.flavor)+'</g>'+
   '<g clip-path="url(#scoopRight)">'+oneScoop(state.flavor2)+'</g>';
 }
 return oneScoop(state.flavor);
}
function sauceSvg(){let s=state.sauce;if(!s)return '';let c=['','#6e3428','#e85b7b','#fffdf0'][s];return `<path d="M101 155 Q115 141 125 145 Q141 136 150 158 Q162 171 151 179 L148 199 Q144 204 141 197 L138 178 Q124 187 116 176 L110 198 Q106 205 102 196Z" fill="${c}" stroke="#ffffff55" stroke-width="2"/>`}
function sprinklesSvg(){if(!state.sprinkles)return '';let s='';for(let i=0;i<24;i++){let x=83+(i*37)%86,y=163+(i*29)%78;s+=`<rect x="${x}" y="${y}" width="9" height="3" rx="1" transform="rotate(${i*31} ${x} ${y})" fill="${['#ff5786','#3e9de0','#f1c22b','#72b45b'][i%4]}"/>`}return s}
function render(){document.getElementById('cone').innerHTML=coneSvg();document.getElementById('ice').innerHTML=iceSvg();document.getElementById('sauce').innerHTML=sauceSvg();document.getElementById('sprinkle').innerHTML=sprinklesSvg();document.getElementById('steps').innerHTML=steps.map((s,i)=>`<button class="${step===i?'active':''}" onclick="step=${i};page=0;render()">${i+1}. ${s}</button>`).join('');document.getElementById('heading').textContent=['コーンを えらぼう','まきかたを えらぼう','あじを えらぼう','ソースを かけよう','すきな かざりを のせよう'][step];document.getElementById('mixControls').style.display=step===2?'flex':'none';document.getElementById('mixOne').classList.toggle('active',!state.mix);document.getElementById('mixTwo').classList.toggle('active',state.mix);let opts=currentOptions(),pages=Math.max(1,Math.ceil(opts.length/10));page=Math.min(page,pages-1);document.getElementById('pageNav').style.display=pages>1?'flex':'none';document.getElementById('pageCount').textContent=(page+1)+' / '+pages;document.getElementById('choices').innerHTML=opts.slice(page*10,page*10+10).map((o,j)=>{let i=j+page*10;let sel=(step===0&&state.cone===i)||(step===1&&state.shape===i)||(step===2&&(state.flavor===i||state.mix&&state.flavor2===i))||(step===3&&(i===4?state.sprinkles:state.sauce===i));let bg=step===2?o[2]:'#fff0d6';let decorArt=step===4?({0:"ai-strawberry.png",1:"deco-cherry.png",2:"ai-banana.png",4:"deco-wafer.png",6:"deco-star.png",7:"deco-heart.png"}[i]||null):null;let previewArt=step===0?(i===5?null:"cone-raster-"+Math.min(i,4)+".png"):null;let previewSvg=step===1?'<svg class="scoop-thumb" xmlns="http://www.w3.org/2000/svg" viewBox="58 29 134 210">'+oneScoop(0,i)+'</svg>':step===0&&i===5?'<svg class="scoop-thumb" xmlns="http://www.w3.org/2000/svg" viewBox="58 202 134 130">'+coneSvg(5)+'</svg>':null;return `<button class="choice ${sel?'selected':''}" style="background:${bg}" onclick="choose(${i})">${o[2]&&step===4?`<img src="${o[2]}" style="width:52px;height:52px;object-fit:contain">`:(decorArt||previewArt)?`<img src="${decorArt||previewArt}" alt="" style="width:62px;height:62px;object-fit:contain">`:previewSvg?previewSvg:`<span class="emoji">${o[1]}</span>`}<span>${o[0]}</span></button>`}).join('');document.getElementById('customArea').style.display=step===4?'block':'none';if(step===4)manageCustom();document.getElementById('note').textContent=step===4?'かざりは10こまで。ゴミばこに うごかすと けせるよ。':step===2&&state.mix?'① ひだり、② みぎ のじゅんに あじを えらんでね':'えらぶと ひだりの アイスが かわるよ。';let layer=document.getElementById('decorLayer');layer.innerHTML='';decors.forEach(d=>{let el=document.createElement('div');el.className='decor';el.style.cssText=`left:${d.x}%;top:${d.y}%;pointer-events:auto`;el.innerHTML=d.src?`<img src="${d.src}">`:d.emoji;el.title=d.label+'（ゴミ箱にドラッグして消す）';el.onpointerdown=e=>{e.preventDefault();el.setPointerCapture(e.pointerId);beep(380);let r=document.getElementById('preview').getBoundingClientRect();const trash=document.getElementById('trashZone');let moved=false;el.onpointermove=ev=>{moved=true;d.x=Math.max(2,Math.min(85,(ev.clientX-r.left)/r.width*100));d.y=Math.max(5,Math.min(85,(ev.clientY-r.top)/r.height*100));el.style.left=d.x+'%';el.style.top=d.y+'%';let t=trash.getBoundingClientRect();trash.classList.toggle('hot',ev.clientX>=t.left-18&&ev.clientX<=t.right+18&&ev.clientY>=t.top-18&&ev.clientY<=t.bottom+18)};el.onpointerup=ev=>{el.onpointermove=null;let t=trash.getBoundingClientRect();let hit=ev.clientX>=t.left-18&&ev.clientX<=t.right+18&&ev.clientY>=t.top-18&&ev.clientY<=t.bottom+18;trash.classList.remove('hot');if(hit&&moved){decors=decors.filter(x=>x.id!==d.id);beep(240);render()}};el.onpointercancel=()=>{el.onpointermove=null;trash.classList.remove('hot')}};layer.append(el)})}
function next(){if(step<4){step++;page=0;render()}else{beep(800);speak('できあがり！');document.getElementById('toast').textContent='✨ できあがり！ ✨'}}function back(){step=Math.max(0,step-1);page=0;render()}function reset(){state={cone:0,shape:1,flavor:0,flavor2:null,mix:false,sauce:0,sprinkles:false};decors=[];step=0;page=0;render()}
function manageCustom(){let area=document.getElementById('customManage');area.innerHTML='';customs.forEach((c,i)=>{let b=document.createElement('button');b.textContent='× '+c.name;b.title=c.name+'を削除';b.onclick=()=>{if(confirm(c.name+'を削除する？')){customs.splice(i,1);try{localStorage.setItem('soft_customs',JSON.stringify(customs))}catch{};page=0;render()}};area.append(b)})}
async function resizeData(file){return new Promise(resolve=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let cv=document.createElement('canvas'),k=Math.min(1,240/Math.max(im.width,im.height));cv.width=Math.max(1,Math.round(im.width*k));cv.height=Math.max(1,Math.round(im.height*k));cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);resolve(cv.toDataURL('image/png'))};im.src=r.result};r.readAsDataURL(file)})}
document.getElementById('upload').onchange=async e=>{let fs=[...e.target.files];for(let f of fs){let name=prompt('かざりの なまえを いれてね',f.name.replace(/\.[^.]+$/,''));if(!name)continue;let data=await resizeData(f);customs.push({name:name.slice(0,24),data});}try{localStorage.setItem('soft_customs',JSON.stringify(customs))}catch{alert('保存容量が足りません。画像を減らしてください')}e.target.value='';page=Math.max(0,Math.ceil(currentOptions().length/10)-1);render()};

/* Test build: remove only near-white, edge-connected raster backgrounds.
   Existing transparent PNGs and cream highlights are preserved. */
(function(){
 const assets=new Set([
 'soft-round.png','soft-classic.png','soft-fine.png',
 'cone-raster-0.png','cone-raster-1.png','cone-raster-2.png',
 'cone-raster-3.png','cone-raster-4.png','cone-waffle-cup-raster.png',
 'ai-strawberry.png','deco-cherry.png','ai-banana.png','deco-wafer.png',
 'deco-star.png','deco-heart.png','deco-bow.png','ice-bowl-raster.png'
 ]);
 const cache=new Map(), loading=new Set();
 function apply(){
  document.querySelectorAll('img[src],image[href]').forEach(el=>{
   const attr=el.tagName.toLowerCase()==='image'?'href':'src';
   const value=el.getAttribute(attr);
   if(!value||value.startsWith('data:'))return;
   const name=value.split('?')[0].split('/').pop();
   if(assets.has(name)&&cache.has(name))el.setAttribute(attr,cache.get(name));
  });
 }
 function clean(name){
  if(loading.has(name))return;
  loading.add(name);
  const im=new Image();
  im.onload=()=>{
   try{
    const w=im.naturalWidth,h=im.naturalHeight;
    if(!w||!h||w*h>3000000)return;
    const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
    const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(im,0,0);
    const img=ctx.getImageData(0,0,w,h),p=img.data;
    let white=0,clear=0;
    for(const idx of [0,w-1,(h-1)*w,w*h-1]){
      const j=4*idx;
      if(p[j+3]<240)clear++;
      if(p[j+3]>245&&Math.min(p[j],p[j+1],p[j+2])>=248)white++;
    }
    // No solid white background: don't change antialiased original art.
    if(clear>0||white<3)return;
    const seen=new Uint8Array(w*h),q=new Int32Array(w*h);let head=0,tail=0;
    function push(i){if(seen[i])return;seen[i]=1;const j=4*i;
      if(p[j+3]>240&&Math.min(p[j],p[j+1],p[j+2])>=245)q[tail++]=i;
    }
    for(let x=0;x<w;x++){push(x);push((h-1)*w+x)}
    for(let y=0;y<h;y++){push(y*w);push(y*w+w-1)}
    if(!tail)return;
    while(head<tail){const i=q[head++],j=4*i;p[j+3]=0;
      const x=i%w,y=(i/w)|0;
      if(x>0)push(i-1);if(x<w-1)push(i+1);
      if(y>0)push(i-w);if(y<h-1)push(i+w);
    }
    ctx.putImageData(img,0,0);cache.set(name,canvas.toDataURL('image/png'));apply();
   }catch(e){/* retain original on unsupported canvas */ }
  };
  im.src=name;
 }
 assets.forEach(clean);
 const obs=new MutationObserver(apply);
 obs.observe(document.body,{subtree:true,childList:true});
 apply();
})();
