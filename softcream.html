<style>

n:none;cursor:grab;font-size:32px;user-select:none;filter:drop-shadow(0 2px 1px #8a6a5a)}.decor img{width:52px;height:52px;object-fit:contain}.small{font-size:12px} @media(max-width:550px){.layout{grid-template-columns:42% 58%}.menu{padding:7px}.choices{grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}.choice{min-height:59px;font-size:12px}.emoji{font-size:24px}.steps button{padding:7px;font-size:12px}.heading{font-size:16px}.decor{font-size:25px}}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-x pan-y}button{touch-action:manipulation}.preview,.decor,#decorLayer{touch-action:none}.menu{display:flex;flex-direction:column}.menu .heading{margin:4px 0 7px}.choices{flex:0 1 auto;overflow:hidden}.steps{flex-shrink:0}.actions{flex-shrink:0}.page-nav{display:flex;justify-content:center;align-items:center;gap:12px;margin:5px 0;flex-shrink:0}.page-nav button{padding:6px 15px;border-radius:15px;background:#ffe0a8}.page-nav button:disabled{opacity:.3}#customArea{flex-shrink:0;margin-top:4px!important;padding:5px!important}.tiny{margin:4px 0}.trash-zone{position:absolute;right:8px;bottom:32px;z-index:8;background:#fff7ed;border:3px dashed #d48b8b;border-radius:18px;padding:8px 12px;font-size:15px;font-weight:900;color:#9e5252;pointer-events:none;box-shadow:0 3px 12px #0002}.trash-zone.hot{background:#ffc4c4;border-color:#e44b58;transform:scale(1.07)}#decorLayer .decor{z-index:3}.choice img{max-width:42px;max-height:42px}.choice .emoji{filter:drop-shadow(0 1px 1px #fff8)}#customArea input{font-size:13px}#customManage{display:flex;gap:4px;flex-wrap:wrap;max-height:42px;overflow:hidden}#customManage button{background:#ffe1d2;padding:3px 7px;border-radius:9px;font-size:11px}@media(max-height:650px){.choice{min-height:46px}.choice .emoji{font-size:21px}.actions button{padding:7px!important}.menu .heading{font-size:15px;margin:3px}.steps button{padding:6px!important}#note{display:none}}

<header><a href="./index.html" style="color:#633d2a;text-decoration:none;font-weight:bold">← あそびランド</a><h1>🍦 ちいさなソフトクリームやさん</h1><button class="secondary" onclick="reset()">はじめから</button></header>
<main class="layout"><section class="preview" id="preview"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 430" aria-label="ソフトクリームのプレビュー">
<ellipse cx="125" cy="401" rx="79" ry="13" fill="#d9c6aa"/><rect x="93" y="369" width="64" height="17" rx="7" fill="#aab9c1"/><rect x="119" y="334" width="12" height="40" fill="#aab9c1"/><ellipse cx="125" cy="332" rx="53" ry="12" fill="#8fa3af"/>
<g id="ice"></g><g id="cone"></g><g id="sauce"></g><g id="sprinkle"></g></svg><div id="decorLayer" style="position:absolute;inset:0;pointer-events:none"></div><div id="trashZone" class="trash-zone">🗑️ ここに すてる</div><div class="toast" id="toast">すきなものを えらんでね！</div></section>
<section class="menu"><nav class="steps" id="steps"></nav><h2 class="heading" id="heading"></h2><div id="mixControls" style="display:none;justify-content:center;gap:10px;margin:5px"><button id="mixOne" onclick="state.mix=false;state.flavor2=null;render()">1しょく</button><button id="mixTwo" onclick="state.mix=true;state.flavor2=null;render()">ミックス（2しょく）</button></div><div class="choices" id="choices"></div><div class="page-nav" id="pageNav"><button onclick="pageChange(-1)">◀ まえ</button><b id="pageCount">1 / 1</b><button onclick="pageChange(1)">つぎ ▶</button></div><div id="customArea"><label>かざりの イラストを とうろく <input type="file" accept="image/*" id="upload" multiple></label><div id="customManage"></div><div class="tiny">とうろくした画像はこの端末のブラウザに保存します。</div></div><div class="actions"><button class="secondary" onclick="back()">◀ まえ</button><button class="primary" onclick="next()">つぎへ ▶</button><button class="secondary" onclick="save()">📷 ほぞん</button></div><p class="tiny" id="note"></p></section></main>
<script>
const steps=['コーン','まきかた','あじ','ソース','かざり'];let step=0, page=0, savedSignature='',decors=[],serial=0;
const cones=[['ワッフル','🧇','#d4a36d'],['チョコワッフル','🍫','#78432c'],['カラフル','🌈','#efaf67'],['フラワー','🌼','#e3b77c'],['シュガー','🔻','#d5a067'],['ワッフルカップ','🧇','#d7a46b']];
const shapes=[['まるまる','☁️'],['ぐるぐる','🍦'],['ほそほそ','🧵']];
const flavors=[['バニラ','🌼','#fff0d2'],['いちご','🍓','#f5a0bc'],['ラズベリー','🍓','#e93649'],['まっちゃ','🍃','#91ba72'],['チョコ','🍫','#8d5c40'],['ラムネ','🫧','#85d8f2'],['みかん','🍊','#f7a13d'],['ラベンダー','🪻','#bba3dd'],['レモン','🍋','#f4e34f']];
const sauces=[['なし','🚫'],['チョコ','🍫'],['いちご','🍓'],['ホワイト','🥛'],['カラースプレー','🌈']];
const decorations=[['いちご','🍓'],['さくらんぼ','🍒'],['バナナ','🍌'],['クッキー','🍪'],['ウェハース','🧇'],['チョコスティック','🍫'],['ほし','⭐'],['ハート','❤️'],['リボン','🎀'],['おたんじょうび','🎉']];
let state={cone:0,shape:1,flavor:0,flavor2:null,mix:false,sauce:0,sprinkles:false};
let customs=[];try{customs=JSON.parse(localStorage.getItem('soft_customs')||'[]')}catch{}
function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.85;speechSynthesis.speak(u)}catch{}}
function beep(freq=500){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=freq;g.gain.setValueAtTime(.045,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.13);o.start();o.stop(a.currentTime+.14)}catch{}}
function pageChange(d){page=Math.max(0,Math.min(page+d,Math.ceil(currentOptions().length/10)-1));render()}function currentOptions(){return [cones,shapes,flavors,sauces,decorations.concat(customs.map(c=>[c.name,'🖼️',c.data]))][step]}function choose(i){beep();if(step===0){state.cone=i;speak(cones[i][0]+'コーン')}if(step===1){state.shape=i;speak(shapes[i][0])}if(step===2){if(state.mix){if(state.flavor2===null){state.flavor=i;state.flavor2=-1}else if(state.flavor2===-1){state.flavor2=i}else{state.flavor=i;state.flavor2=-1}}else{state.flavor=i} speak(flavors[i][0])}if(step===3){if(i===4){state.sprinkles=!state.sprinkles}else{state.sauce=i} speak(sauces[i][0])}if(step===4){let items=currentOptions();if(decors.length>=10){document.getElementById('toast').textContent='かざりは 10こまで！';return}let item=items[i];decors.push({id:++serial,label:item[0],emoji:item[1],src:item[2]||({0:'ai-strawberry.png',1:'deco-cherry.png',2:'ai-banana.png',3:'ai-donut.png',4:'deco-wafer.png',5:'deco-wafer.png',6:'deco-star.png',7:'deco-heart.png',8:'deco-bow.png',9:'deco-flower.png'}[i]||''),x:50+(decors.length%3-1)*13,y:27+Math.floor(decors.length/3)*9});speak(item[0]);}render()}

function coneSvg(i=state.cone){
 if(i===5){
   return '<g aria-label="たべられる ワッフルカップ">'+
   '<path d="M65 219 Q125 204 185 219 L172 300 Q125 335 78 300 Z" fill="#dba05c" stroke="#8f5829" stroke-width="4"/>'+
   '<path d="M81 234 L167 311 M63 246 L158 321 M91 219 L176 291 M109 217 L181 268 M168 234 L82 307 M184 249 L98 319 M151 218 L75 287 M128 215 L69 269" stroke="#9a602d" stroke-width="4" opacity=".48"/>'+
   '<ellipse cx="125" cy="221" rx="61" ry="14" fill="#b87335" stroke="#8f5829" stroke-width="4"/>'+
   '<ellipse cx="125" cy="215" rx="62" ry="13" fill="none" stroke="#f8cf83" stroke-width="8"/>'+
   '<path d="M81 235 Q125 251 169 235" fill="none" stroke="#ffd88e" stroke-width="3" opacity=".8"/>'+
   '</g>';
 }
 return '<image href="cone-raster-'+Math.min(i,4)+'.png" x="60" y="207" width="130" height="180" preserveAspectRatio="none"/>';
}
function tint(hex,factor){
 let a=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));
 return '#'+a.map(v=>Math.max(0,Math.min(255,Math.round(factor>0?v+(255-v)*factor:v*(1+factor)))).toString(16).padStart(2,'0')).join('');
}
function oneScoop(n,style=state.shape){
 const color=flavors[n][2], bright=tint(color,.48), shade=tint(color,-.29), deep=tint(color,-.47);
 const grad='<defs><linearGradient id="scoop'+n+'" x1="0" y1="0" x2="1" y2=".55"><stop stop-color="'+bright+'"/><stop offset=".38" stop-color="'+color+'"/><stop offset=".78" stop-color="'+color+'"/><stop offset="1" stop-color="'+shade+'"/></linearGradient></defs>';
 const fill='url(#scoop'+n+')';
 const stroke='stroke="'+deep+'" stroke-width="2.5" stroke-linejoin="round"';
 let graphic='';
 if(style===0){
  // Round nozzle: three unmistakably round, smooth pillow-like tiers.
  graphic='<path d="M71 196 C65 178 81 164 96 163 C83 145 92 128 109 124 C103 109 114 97 125 83 C139 100 147 112 140 125 C162 127 170 148 155 166 C176 168 187 185 179 198 L182 227 Q125 244 68 227 Z" fill="'+fill+'" '+stroke+'/>'+
  '<ellipse cx="125" cy="199" rx="56" ry="27" fill="'+fill+'" '+stroke+'/>'+
  '<ellipse cx="125" cy="159" rx="43" ry="24" fill="'+fill+'" '+stroke+'/>'+
  '<ellipse cx="125" cy="125" rx="30" ry="20" fill="'+fill+'" '+stroke+'/>'+
  '<path d="M120 113 Q127 86 125 72 Q139 88 133 113" fill="'+fill+'" '+stroke+'/>'+
  '<path d="M87 187 Q106 174 137 184 M99 149 Q118 139 139 146" stroke="'+bright+'" stroke-width="6" opacity=".72" fill="none" stroke-linecap="round"/>';
 }else if(style===1){
  // Classic medium star: spiral fluted soft-serve with multiple broad turns.
  graphic='<path d="M71 227 Q59 204 78 183 Q70 162 95 146 Q91 120 111 108 Q102 88 125 47 Q143 72 143 92 Q160 108 151 130 Q177 150 161 169 Q194 187 178 211 L182 227 Q125 241 71 227Z" fill="'+fill+'" '+stroke+'/>'+
  '<path d="M79 215 Q123 237 174 213 Q180 202 166 195 Q112 210 85 197 Q73 191 81 180 Q115 195 157 174 Q172 163 155 154 Q112 172 91 153 Q82 144 96 135 Q124 147 147 127 Q156 117 139 110 Q118 121 109 107 Q104 101 117 95 Q131 101 139 88" fill="none" stroke="'+deep+'" stroke-width="7" opacity=".52" stroke-linecap="round"/>'+
  '<path d="M78 203 Q117 220 162 201 M90 169 Q120 181 153 160 M108 123 Q127 131 140 117" fill="none" stroke="'+bright+'" stroke-width="8" opacity=".83" stroke-linecap="round"/>';
 }else{
  // Small star tip: tall narrow sharp flutes, ridges all the way to the point.
  graphic='<path d="M65 226 Q69 200 86 182 Q78 158 96 142 Q89 122 109 108 Q106 84 119 64 L125 35 L131 64 Q151 84 141 108 Q162 121 152 143 Q172 160 164 183 Q185 200 185 226 Q125 241 65 226Z" fill="'+fill+'" '+stroke+'/>'+
  '<path d="M125 38 Q113 94 89 151 Q77 184 72 225 M125 38 Q120 100 108 155 L95 231 M125 38 Q126 105 126 158 L125 237 M125 38 Q136 104 143 157 L155 231 M125 38 Q148 101 162 163 L179 226" fill="none" stroke="'+deep+'" stroke-width="5" opacity=".68" stroke-linecap="round"/>'+
  '<path d="M115 87 Q119 118 109 153 L101 211 M132 85 Q139 120 143 154 L150 211" fill="none" stroke="'+bright+'" stroke-width="5" opacity=".82" stroke-linecap="round"/>'+
  '<path d="M78 192 Q125 206 173 192 M91 155 Q125 171 158 155 M105 116 Q125 127 146 116" fill="none" stroke="'+shade+'" stroke-width="4" opacity=".56"/>';
 }
 return grad+graphic;
}
function iceSvg(){
 if(state.mix&&state.flavor2!==null&&state.flavor2>=0){
  return '<defs><clipPath id="scoopLeft"><rect x="55" y="25" width="70" height="218"/></clipPath><clipPath id="scoopRight"><rect x="125" y="25" width="70" height="218"/></clipPath></defs>'+
    '<g clip-path="url(#scoopLeft)">'+oneScoop(state.flavor)+'</g>'+
    '<g clip-path="url(#scoopRight)">'+oneScoop(state.flavor2)+'</g>';
 }
 return oneScoop(state.flavor);
}

function sauceSvg(){let s=state.sauce;if(!s)return '';let c=['','#6e3428','#e85b7b','#fffdf0'][s];return `<path d="M101 155 Q115 141 125 145 Q141 136 150 158 Q162 171 151 179 L148 199 Q144 204 141 197 L138 178 Q124 187 116 176 L110 198 Q106 205 102 196Z" fill="${c}" stroke="#ffffff55" stroke-width="2"/>`}
function sprinklesSvg(){if(!state.sprinkles)return '';let s='';for(let i=0;i<24;i++){let x=83+(i*37)%86,y=163+(i*29)%78;s+=`<rect x="${x}" y="${y}" width="9" height="3" rx="1" transform="rotate(${i*31} ${x} ${y})" fill="${['#ff5786','#3e9de0','#f1c22b','#72b45b'][i%4]}"/>`}return s}
function render(){document.getElementById('cone').innerHTML=coneSvg();document.getElementById('ice').innerHTML=iceSvg();document.getElementById('sauce').innerHTML=sauceSvg();document.getElementById('sprinkle').innerHTML=sprinklesSvg();document.getElementById('steps').innerHTML=steps.map((s,i)=>`<button class="${step===i?'active':''}" onclick="step=${i};page=0;render()">${i+1}. ${s}</button>`).join('');document.getElementById('heading').textContent=['コーンを えらぼう','まきかたを えらぼう','あじを えらぼう','ソースを かけよう','すきな かざりを のせよう'][step];document.getElementById('mixControls').style.display=step===2?'flex':'none';document.getElementById('mixOne').classList.toggle('active',!state.mix);document.getElementById('mixTwo').classList.toggle('active',state.mix);let opts=currentOptions(),pages=Math.max(1,Math.ceil(opts.length/10));page=Math.min(page,pages-1);document.getElementById('pageNav').style.display=pages>1?'flex':'none';document.getElementById('pageCount').textContent=(page+1)+' / '+pages;document.getElementById('choices').innerHTML=opts.slice(page*10,page*10+10).map((o,j)=>{let i=j+page*10;let sel=(step===0&&state.cone===i)||(step===1&&state.shape===i)||(step===2&&(state.flavor===i||state.mix&&state.flavor2===i))||(step===3&&(i===4?state.sprinkles:state.sauce===i));let bg=step===2?o[2]:'#fff0d6';let decorArt=step===4?({0:"ai-strawberry.png",1:"deco-cherry.png",2:"ai-banana.png",3:"ai-donut.png",4:"deco-wafer.png",6:"deco-star.png",7:"deco-heart.png"}[i]||null):null;let previewArt=step===0?(i===5?null:"cone-raster-"+Math.min(i,4)+".png"):null;let previewSvg=step===1?'<svg class="scoop-thumb" xmlns="http://www.w3.org/2000/svg" viewBox="58 29 134 210">'+oneScoop(0,i)+'</svg>':step===0&&i===5?'<svg class="scoop-thumb" xmlns="http://www.w3.org/2000/svg" viewBox="58 202 134 130">'+coneSvg(5)+'</svg>':null;return `<button class="choice ${sel?'selected':''}" style="background:${bg}" onclick="choose(${i})">${o[2]&&step===4?`<img src="${o[2]}" style="width:52px;height:52px;object-fit:contain">`:(decorArt||previewArt)?`<img src="${decorArt||previewArt}" alt="" style="width:62px;height:62px;object-fit:contain">`:previewSvg?previewSvg:`<span class="emoji">${o[1]}</span>`}<span>${o[0]}</span></button>`}).join('');document.getElementById('customArea').style.display=step===4?'block':'none';if(step===4)manageCustom();document.getElementById('note').textContent=step===4?'かざりは10こまで。ゴミばこに うごかすと けせるよ。':step===2&&state.mix?'① ひだり、② みぎ のじゅんに あじを えらんでね':'えらぶと ひだりの アイスが かわるよ。';let layer=document.getElementById('decorLayer');layer.innerHTML='';decors.forEach(d=>{let el=document.createElement('div');el.className='decor';el.style.cssText=`left:${d.x}%;top:${d.y}%;pointer-events:auto`;el.innerHTML=d.src?`<img src="${d.src}">`:d.emoji;el.title=d.label+'（ゴミ箱にドラッグして消す）';el.onpointerdown=e=>{e.preventDefault();el.setPointerCapture(e.pointerId);beep(380);let r=document.getElementById('preview').getBoundingClientRect();const trash=document.getElementById('trashZone');let moved=false;el.onpointermove=ev=>{moved=true;d.x=Math.max(2,Math.min(85,(ev.clientX-r.left)/r.width*100));d.y=Math.max(5,Math.min(85,(ev.clientY-r.top)/r.height*100));el.style.left=d.x+'%';el.style.top=d.y+'%';let t=trash.getBoundingClientRect();trash.classList.toggle('hot',ev.clientX>=t.left-18&&ev.clientX<=t.right+18&&ev.clientY>=t.top-18&&ev.clientY<=t.bottom+18)};el.onpointerup=ev=>{el.onpointermove=null;let t=trash.getBoundingClientRect();let hit=ev.clientX>=t.left-18&&ev.clientX<=t.right+18&&ev.clientY>=t.top-18&&ev.clientY<=t.bottom+18;trash.classList.remove('hot');if(hit&&moved){decors=decors.filter(x=>x.id!==d.id);beep(240);render()}};el.onpointercancel=()=>{el.onpointermove=null;trash.classList.remove('hot')}};layer.append(el)})}
function next(){if(step<4){step++;page=0;render()}else{beep(800);speak('できあがり！');document.getElementById('toast').textContent='✨ できあがり！ ✨'}}function back(){step=Math.max(0,step-1);page=0;render()}function reset(){state={cone:0,shape:1,flavor:0,flavor2:null,mix:false,sauce:0,sprinkles:false};decors=[];step=0;page=0;render()}
function manageCustom(){let area=document.getElementById('customManage');area.innerHTML='';customs.forEach((c,i)=>{let b=document.createElement('button');b.textContent='× '+c.name;b.title=c.name+'を削除';b.onclick=()=>{if(confirm(c.name+'を削除する？')){customs.splice(i,1);try{localStorage.setItem('soft_customs',JSON.stringify(customs))}catch{};page=0;render()}};area.append(b)})}
async function resizeData(file){return new Promise(resolve=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let cv=document.createElement('canvas'),k=Math.min(1,240/Math.max(im.width,im.height));cv.width=Math.max(1,Math.round(im.width*k));cv.height=Math.max(1,Math.round(im.height*k));cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);resolve(cv.toDataURL('image/png'))};im.src=r.result};r.readAsDataURL(file)})}
document.getElementById('upload').onchange=async e=>{let fs=[...e.target.files];for(let f of fs){let name=prompt('かざりの なまえを いれてね',f.name.replace(/\.[^.]+$/,''));if(!name)continue;let data=await resizeData(f);customs.push({name:name.slice(0,24),data});}try{localStorage.setItem('soft_customs',JSON.stringify(customs))}catch{alert('保存容量が足りません。画像を減らしてください')}e.target.value='';page=Math.max(0,Math.ceil(currentOptions().length/10)-1);render()};
async function save(){let sig=JSON.stringify({state,decors});if(sig===savedSignature){document.getElementById('toast').textContent='おなじ しゃしんは ほぞんずみ！';return}let svg=document.querySelector('.preview svg').cloneNode(true);for(let el of svg.querySelectorAll('image')){let href=el.getAttribute('href');if(href&&!href.startsWith('data:')){try{let response=await fetch(href);let b=await response.blob();let data=await new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(b)});el.setAttribute('href',data)}catch{}}}let blob=new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'});let url=URL.createObjectURL(blob),img=new Image();img.onload=async()=>{let c=document.createElement('canvas');c.width=700;c.height=1200;let ctx=c.getContext('2d');ctx.fillStyle='#fff7e7';ctx.fillRect(0,0,700,1200);ctx.drawImage(img,0,0,700,1200);let p=document.getElementById('preview').getBoundingClientRect();for(let d of decors){let x=d.x/100*700,y=d.y/100*1200;if(d.src){let im=new Image();im.src=d.src;try{await im.decode();ctx.drawImage(im,x,y,100,100)}catch{}}else{ctx.font='75px serif';ctx.fillText(d.emoji,x,y+75)}}c.toBlob(async b=>{let file=new File([b],'softcream.jpg',{type:'image/jpeg'});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});document.getElementById('toast').textContent='しゃしんを ほぞんしてね'}else{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='softcream.jpg';a.click();document.getElementById('toast').textContent='しゃしんを ダウンロードしたよ'}savedSignature=sig;beep(900)}catch{document.getElementById('toast').textContent='ほぞんを やめたよ'}},'image/jpeg',.85);URL.revokeObjectURL(url)};img.src=url}
render();
</script></html>
