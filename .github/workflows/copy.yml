name: Copy app to test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: RioKeiNoOya/asobi-land
          ref: main
          path: source
          persist-credentials: false
      - name: Copy files
        run: |
          rsync -a --exclude='/.git/' --exclude='/.github/' source/ ./
          rm -rf source
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Copy app for testing"
            git push
          fi
