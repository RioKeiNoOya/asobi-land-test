
name: Copy app to test
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: RioKeiNoOya/asobi-land
          ref: main
          path: source
      - name: Copy files
        run: |
          cp -a source/. .
          rm -rf source
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Copy app for testing"
          git push
  
