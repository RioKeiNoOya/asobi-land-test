name: Compress soft-serve cone fronts
on:
  push:
    paths:
      - 'scripts/compress-cone-fronts.py'
      - '.github/workflows/compress-cone-fronts.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow
      - run: python scripts/compress-cone-fronts.py
      - name: Commit generated assets
        run: |
          git add cone-raster-*-front.webp cone-waffle-cup-raster-front.webp
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Compress cone foreground layers to WebP"
            git pull --rebase origin main
            git push origin main
          fi
